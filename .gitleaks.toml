title = "sdlc-agent gitleaks config"

[extend]
useDefault = true

# Only test fixtures are allowlisted: fake tokens used by unit and integration tests.
[allowlist]
description = "Test fixtures"
paths = [
  '''\.test\.tsx?$''',
  '''apps/api/src/testing/''',
  '''test/fake-claude/''',
]
regexes = [
  '''sk-ant-oat01-(ABCDEF|AbCdEf|FAKE)''',
  '''ghp_abcdefghij''',
  '''ATATT3xFfGF0''',
]
