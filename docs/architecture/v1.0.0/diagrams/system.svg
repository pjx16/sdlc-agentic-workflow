<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-label="The browser talks to the dashboard and API. One worker reads the queue from Postgres, pushes to GitHub, talks to Jira, and starts throwaway agent and command containers whose internet access goes through an allowlisting proxy.">
<style>
:root{--surface:#ffffff;--fg:#17202b;--muted:#5a6776;--line:#9aa6b4;--machine:#0e7a70;--machine-bg:#dff3f0;--human:#a65a00;--human-bg:#fdecd0;--zone-bg:#eef1f5;--sealed:#7a2e3a;--sealed-bg:#f8e4e7;}
@media (prefers-color-scheme: dark){:root{--surface:#172029;--fg:#e6ebf1;--muted:#98a5b4;--line:#62707f;--machine:#4fd1c0;--machine-bg:#123a38;--human:#f2b254;--human-bg:#3e2c10;--zone-bg:#131c25;--sealed:#f0929f;--sealed-bg:#3a1a21;}}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.sub{fill:var(--muted);font-size:11.5px}
.lab,.zone-t{fill:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.m{fill:var(--machine-bg);stroke:var(--machine)}
.box.h{fill:var(--human-bg);stroke:var(--human)}
.box.s{fill:var(--sealed-bg);stroke:var(--sealed)}
.ext{fill:var(--zone-bg);stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 3}
.zone{fill:var(--zone-bg);stroke:var(--line);stroke-width:1.2;stroke-dasharray:6 4}
.zone.s{fill:none;stroke:var(--sealed)}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.d{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.t-h{fill:var(--human);font-weight:600}
.t-m{fill:var(--machine);font-weight:600}
.t-s{fill:var(--sealed);font-weight:600}
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
        </defs>

        <!-- compose network -->
        <rect class="zone" x="10" y="14" width="882" height="580" rx="10" style="fill:none"/>
        <text class="zone-t" x="24" y="34">DOCKER COMPOSE NETWORK</text>

        <!-- row 1 -->
        <rect class="box h" x="24" y="56" width="130" height="54" rx="6"/>
        <text class="t-h" x="89" y="80" text-anchor="middle">You, in a browser</text>
        <text class="sub" x="89" y="97" text-anchor="middle">approve · answer · merge</text>

        <rect class="box" x="210" y="56" width="150" height="54" rx="6"/>
        <text x="285" y="80" text-anchor="middle">Dashboard</text>
        <text class="sub" x="285" y="97" text-anchor="middle">Next.js · password login</text>

        <rect class="box" x="410" y="56" width="150" height="54" rx="6"/>
        <text x="485" y="80" text-anchor="middle">API</text>
        <text class="sub" x="485" y="97" text-anchor="middle">NestJS · REST</text>

        <rect class="box" x="650" y="56" width="150" height="54" rx="6"/>
        <text x="725" y="80" text-anchor="middle">Postgres</text>
        <text class="sub" x="725" y="97" text-anchor="middle">tickets · queue · findings</text>

        <line class="edge" x1="154" y1="83" x2="208" y2="83" marker-end="url(#a)"/>
        <line class="edge" x1="360" y1="83" x2="408" y2="83" marker-end="url(#a)"/>
        <text class="lab" x="384" y="75" text-anchor="middle">/api</text>
        <line class="edge" x1="560" y1="83" x2="648" y2="83" marker-start="url(#a)" marker-end="url(#a)"/>
        <text class="lab" x="604" y="75" text-anchor="middle">SQL</text>

        <!-- worker -->
        <rect class="box" x="410" y="180" width="160" height="90" rx="6"/>
        <text x="490" y="208" text-anchor="middle" style="font-weight:600">Worker</text>
        <text class="sub" x="490" y="226" text-anchor="middle">polls the queue</text>
        <text class="sub" x="490" y="242" text-anchor="middle">one running stage</text>
        <text class="sub" x="490" y="258" text-anchor="middle">system-wide (lock)</text>
        <path class="edge" d="M570 200 H725 V112" marker-end="url(#a)"/>
        <text class="lab" x="735" y="150">picks next ticket</text>
        <text class="lab" x="735" y="164">saves every outcome</text>

        <!-- data dir -->
        <rect class="box" x="170" y="190" width="170" height="70" rx="6"/>
        <text x="255" y="218" text-anchor="middle">Data directory</text>
        <text class="sub" x="255" y="236" text-anchor="middle">mirrors · workspaces</text>
        <text class="sub" x="255" y="251" text-anchor="middle">run folders · logs</text>
        <line class="edge" x1="408" y1="225" x2="342" y2="225" marker-end="url(#a)"/>
        <text class="lab" x="375" y="217" text-anchor="middle">git</text>

        <!-- throwaway zone -->
        <rect class="zone s" x="290" y="320" width="440" height="190" rx="10"/>
        <text class="zone-t" x="304" y="340" style="fill:var(--sealed)">THROWAWAY CONTAINERS, STARTED BY THE WORKER</text>
        <rect class="box s" x="310" y="360" width="190" height="120" rx="6"/>
        <text class="t-s" x="405" y="388" text-anchor="middle">Agent container</text>
        <text class="sub" x="405" y="408" text-anchor="middle">Claude Code CLI</text>
        <text class="sub" x="405" y="424" text-anchor="middle">runs one stage, then exits</text>
        <text class="sub" x="405" y="448" text-anchor="middle">has the Claude token</text>
        <text class="sub" x="405" y="464" text-anchor="middle">no GitHub or Jira key</text>
        <rect class="box s" x="520" y="360" width="190" height="120" rx="6"/>
        <text class="t-s" x="615" y="388" text-anchor="middle">Command container</text>
        <text class="sub" x="615" y="408" text-anchor="middle">install · typecheck · tests</text>
        <text class="sub" x="615" y="424" text-anchor="middle">fixed commands only</text>
        <text class="sub" x="615" y="448" text-anchor="middle">no Claude token</text>
        <text class="sub" x="615" y="464" text-anchor="middle">no GitHub or Jira key</text>

        <line class="edge" x1="490" y1="270" x2="490" y2="318" marker-end="url(#a)"/>
        <text class="lab" x="500" y="296">docker run</text>
        <path class="edge d" d="M255 260 V420 H308" marker-end="url(#a)"/>
        <text class="lab" x="247" y="300" text-anchor="end">workspace</text>
        <text class="lab" x="247" y="314" text-anchor="end">mounted</text>

        <!-- proxy -->
        <rect class="box" x="760" y="370" width="110" height="60" rx="6"/>
        <text x="815" y="396" text-anchor="middle">Squid proxy</text>
        <text class="sub" x="815" y="413" text-anchor="middle">host allowlist</text>
        <path class="edge" d="M405 480 V552 H815 V432" marker-end="url(#a)"/>
        <path class="edge" d="M615 480 V552"/>
        <text class="lab" x="420" y="544">all outbound traffic goes through the proxy</text>

        <!-- externals -->
        <rect class="ext" x="900" y="196" width="130" height="44" rx="6"/>
        <text x="965" y="223" text-anchor="middle">GitHub</text>
        <rect class="ext" x="900" y="272" width="130" height="44" rx="6"/>
        <text x="965" y="299" text-anchor="middle">Jira (optional)</text>
        <rect class="ext" x="900" y="346" width="130" height="44" rx="6"/>
        <text x="965" y="373" text-anchor="middle">Anthropic API</text>
        <rect class="ext" x="900" y="410" width="130" height="44" rx="6"/>
        <text x="965" y="437" text-anchor="middle">npm registry</text>

        <path class="edge" d="M570 224 H898" marker-end="url(#a)"/>
        <text class="lab" x="590" y="216">clone · push · PRs · CI status</text>
        <path class="edge" d="M570 254 H850 V294 H898" marker-end="url(#a)"/>
        <text class="lab" x="590" y="270">tickets and status (REST or MCP)</text>
        <line class="edge" x1="870" y1="385" x2="898" y2="372" marker-end="url(#a)"/>
        <line class="edge" x1="870" y1="415" x2="898" y2="430" marker-end="url(#a)"/>
      </svg>
