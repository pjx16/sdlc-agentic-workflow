<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="A ticket moves through planning, plan approval, breakdown, breakdown approval, implementation, review, knowledge base update, CI, human review and done. Any step can move to on hold.">
<style>
:root{--surface:#ffffff;--fg:#17202b;--muted:#5a6776;--line:#9aa6b4;--machine:#0e7a70;--machine-bg:#dff3f0;--human:#a65a00;--human-bg:#fdecd0;--zone-bg:#eef1f5;--sealed:#7a2e3a;--sealed-bg:#f8e4e7;}
@media (prefers-color-scheme: dark){:root{--surface:#172029;--fg:#e6ebf1;--muted:#98a5b4;--line:#62707f;--machine:#4fd1c0;--machine-bg:#123a38;--human:#f2b254;--human-bg:#3e2c10;--zone-bg:#131c25;--sealed:#f0929f;--sealed-bg:#3a1a21;}}
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.sub{fill:var(--muted);font-size:11.5px}
.lab,.zone-t{fill:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.box.m{fill:var(--machine-bg);stroke:var(--machine)}
.box.h{fill:var(--human-bg);stroke:var(--human)}
.box.s{fill:var(--sealed-bg);stroke:var(--sealed)}
.ext{fill:var(--zone-bg);stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 3}
.zone{fill:var(--zone-bg);stroke:var(--line);stroke-width:1.2;stroke-dasharray:6 4}
.zone.s{fill:none;stroke:var(--sealed)}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.edge.d{stroke-dasharray:5 4}
.ah{fill:var(--line)}
.t-h{fill:var(--human);font-weight:600}
.t-m{fill:var(--machine);font-weight:600}
.t-s{fill:var(--sealed);font-weight:600}
</style>
<rect width="100%" height="100%" fill="var(--surface)"/>
        <defs>
          <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
        </defs>

        <!-- row 1 -->
        <rect class="box" x="20" y="30" width="140" height="48" rx="6"/>
        <text x="90" y="59" text-anchor="middle">Ticket arrives</text>
        <rect class="box m" x="185" y="30" width="140" height="48" rx="6"/>
        <text x="255" y="52" text-anchor="middle">Plan</text><text class="sub" x="255" y="68" text-anchor="middle">builds KB first</text>
        <rect class="box h" x="350" y="30" width="140" height="48" rx="6"/>
        <text class="t-h" x="420" y="59" text-anchor="middle">Approve plan</text>
        <rect class="box m" x="515" y="30" width="140" height="48" rx="6"/>
        <text x="585" y="52" text-anchor="middle">Break down</text><text class="sub" x="585" y="68" text-anchor="middle">into subtasks</text>
        <rect class="box h" x="680" y="30" width="140" height="48" rx="6"/>
        <text class="t-h" x="750" y="59" text-anchor="middle">Approve breakdown</text>
        <rect class="box m" x="845" y="30" width="150" height="48" rx="6"/>
        <text x="920" y="52" text-anchor="middle">Build subtasks</text><text class="sub" x="920" y="68" text-anchor="middle">tests first, then code</text>
        <line class="edge" x1="160" y1="54" x2="183" y2="54" marker-end="url(#b)"/>
        <line class="edge" x1="325" y1="54" x2="348" y2="54" marker-end="url(#b)"/>
        <line class="edge" x1="490" y1="54" x2="513" y2="54" marker-end="url(#b)"/>
        <line class="edge" x1="655" y1="54" x2="678" y2="54" marker-end="url(#b)"/>
        <line class="edge" x1="820" y1="54" x2="843" y2="54" marker-end="url(#b)"/>

        <!-- bridge -->
        <path class="edge" d="M920 78 V118 H90 V150" marker-end="url(#b)"/>
        <text class="lab" x="500" y="110" text-anchor="middle">every subtask done: draft PR opened, pushed commit by commit</text>

        <!-- row 2 -->
        <rect class="box m" x="20" y="150" width="140" height="48" rx="6"/>
        <text x="90" y="172" text-anchor="middle">Review</text><text class="sub" x="90" y="188" text-anchor="middle">code and security</text>
        <rect class="box m" x="185" y="150" width="140" height="48" rx="6"/>
        <text x="255" y="172" text-anchor="middle">Update KB</text><text class="sub" x="255" y="188" text-anchor="middle">fix stale docs</text>
        <rect class="box" x="350" y="150" width="140" height="48" rx="6"/>
        <text x="420" y="172" text-anchor="middle">Wait for CI</text><text class="sub" x="420" y="188" text-anchor="middle">checked every 30 s</text>
        <rect class="box h" x="515" y="150" width="140" height="48" rx="6"/>
        <text class="t-h" x="585" y="172" text-anchor="middle">Human review</text><text class="sub" x="585" y="188" text-anchor="middle">PR marked ready</text>
        <rect class="box h" x="680" y="150" width="140" height="48" rx="6"/>
        <text class="t-h" x="750" y="172" text-anchor="middle">You merge</text><text class="sub" x="750" y="188" text-anchor="middle">detected by polling</text>
        <rect class="box" x="845" y="150" width="150" height="48" rx="6"/>
        <text x="920" y="179" text-anchor="middle" style="font-weight:600">Done</text>
        <line class="edge" x1="160" y1="174" x2="183" y2="174" marker-end="url(#b)"/>
        <line class="edge" x1="325" y1="174" x2="348" y2="174" marker-end="url(#b)"/>
        <line class="edge" x1="490" y1="174" x2="513" y2="174" marker-end="url(#b)"/>
        <line class="edge" x1="655" y1="174" x2="678" y2="174" marker-end="url(#b)"/>
        <line class="edge" x1="820" y1="174" x2="843" y2="174" marker-end="url(#b)"/>

        <!-- loops -->
        <text class="lab" x="90" y="222" text-anchor="middle">fix rounds, capped</text>
        <text class="lab" x="255" y="222" text-anchor="middle">docs only</text>
        <text class="lab" x="420" y="222" text-anchor="middle">red CI: one fix round</text>
        <text class="lab" x="585" y="222" text-anchor="middle">re-run KB on request</text>
        <text class="lab" x="750" y="222" text-anchor="middle">closed PR: on hold</text>

        <!-- hold -->
        <rect class="box" x="20" y="252" width="975" height="52" rx="6" style="stroke-dasharray:6 4"/>
        <text x="40" y="274" style="font-weight:600">On hold, from any step</text>
        <text class="sub" x="40" y="292">The agent asked a question (up to 3 per stage) · a stage failed twice · usage is over the threshold · you paused it · the PR was closed. Answer, resume or retry from the dashboard.</text>
      </svg>
