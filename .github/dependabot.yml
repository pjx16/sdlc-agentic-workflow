version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /apps/dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /docker/worker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /docker/agent
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /docker/proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
