name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: integration
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # Docker is preinstalled; pretest:int builds the agent and proxy images itself.
      - run: npm run test:int

  e2e:
    name: e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      # global-setup.ts starts its own Postgres container (testcontainers), applies the migrations, and starts the built API and the dashboard.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (${{ matrix.name }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: worker, context: ., file: docker/worker/Dockerfile }
          - { name: dashboard, context: ., file: apps/dashboard/Dockerfile }
          - { name: proxy, context: docker/proxy, file: docker/proxy/Dockerfile }
          - { name: agent, context: docker/agent, file: docker/agent/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high

  cli:
    name: cli
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run build -w sdlc-agent
      - name: No install scripts in the published package
        run: |
          node -e "const p=require('./packages/cli/package.json');for(const s of ['preinstall','install','postinstall','prepare'])if(p.scripts&&p.scripts[s]){console.error('forbidden script '+s);process.exit(1)}"
      - name: Package contents
        run: npm pack -w sdlc-agent --json --dry-run | node packages/cli/scripts/check-pack.mjs
      - name: Smoke install
        run: |
          set -euo pipefail
          npm pack -w sdlc-agent --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/g" "$RUNNER_TEMP"/sdlc-agent-*.tgz
          "$RUNNER_TEMP/g/bin/sdlc-agent" --version
          "$RUNNER_TEMP/g/bin/sdlc-agent" init --no-start --no-open --dir "$RUNNER_TEMP/inst"
          test "$(stat -c '%a' "$RUNNER_TEMP/inst/.env")" = "600"
          docker compose -f "$RUNNER_TEMP/inst/docker-compose.yml" --env-file "$RUNNER_TEMP/inst/.env" config -q

  cli-macos:
    name: cli (macOS, no Docker)
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run build -w sdlc-agent
      - name: Smoke install (no Docker here, so the doctor is skipped)
        env:
          # Test-only: documented in packages/cli/README.md. Skips the Docker checks, which cannot pass on this runner.
          SDLC_AGENT_SKIP_DOCTOR: '1'
        run: |
          set -euo pipefail
          npm pack -w sdlc-agent --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/g" "$RUNNER_TEMP"/sdlc-agent-*.tgz
          "$RUNNER_TEMP/g/bin/sdlc-agent" --version
          "$RUNNER_TEMP/g/bin/sdlc-agent" init --no-start --no-open --dir "$RUNNER_TEMP/inst"
          test "$(stat -f '%Lp' "$RUNNER_TEMP/inst/.env")" = "600"
          test -f "$RUNNER_TEMP/inst/docker-compose.yml"
          test -d "$RUNNER_TEMP/inst/guidelines"
