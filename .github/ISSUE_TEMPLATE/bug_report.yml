name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        sdlc-agent is a `0.0.x` pre-release built in public. Bug reports are welcome. For security problems, do not open an issue: use the private advisory link on the issue chooser page.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (for example `v0.0.0`), or the commit if you run from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      description: Output of `docker --version`.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `docker compose logs`, or the run log from the dashboard.
      render: shell
  - type: checkboxes
    id: redacted
    attributes:
      label: Confirmation
      options:
        - label: I removed tokens, passwords and private repository content from everything I pasted.
          required: true
