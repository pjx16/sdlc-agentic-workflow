# Egress allowlist for agent containers (BUILD_PLAN 6.1).
# Milestone-0 spike (SPIKE.md 0.6): Claude Code needs only api.anthropic.com (matched by .anthropic.com);
# npm needs registry.npmjs.org. No other domain was contacted, so base_domains needs no additions.
# Agents reach nothing but Anthropic and the npm registry. Jira, Confluence and GitHub are called by the worker, never by agents.
http_port 3128
acl base_domains dstdomain .anthropic.com registry.npmjs.org
acl port_base localport 3128
acl ssl_ports port 443
acl connect_method method CONNECT
http_access deny connect_method !ssl_ports
# Only HTTPS tunnels (CONNECT to 443): plain-HTTP requests to allowlisted domains are refused too.
http_access deny !connect_method
http_access allow port_base base_domains
http_access deny all
